# Keryx LINKED relay — single-VPS stack (TS §8.1 / KRX-050)
#
# Services: LiveKit SFU + Redis + Caddy (TLS 1.3) + coturn (TURN).
# No egress / ingress / recording — TS §8.7: voice is never stored server-side.
#
# Host networking is required for WebRTC UDP (LiveKit RTC + coturn relay).
# `docker compose config` validates on any OS; `up` is intended for a Linux VPS.
#
# token-svc is deliberately NOT a service here (TASK-040: no new services).
# Caddy reverse-proxies /token to TOKEN_SVC_UPSTREAM (loopback :8080).
#
# Before first start: copy .env.example → .env, fill secrets, then
#   python scripts/render_config.py --env .env
#   docker compose --env-file .env config     # must be clean
#   docker compose --env-file .env up -d

name: keryx-relay

x-restart: &restart
  restart: unless-stopped

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-log-cap: &log-cap
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7.4.2-alpine
    <<: [*restart, *security, *log-cap]
    # Ephemeral only: no RDB/AOF. Room metadata dies with the process.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    network_mode: host
    read_only: true
    user: "999:999"
    tmpfs:
      - /data:uid=999,gid=999,mode=0700
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.11
    <<: [*restart, *security, *log-cap]
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    read_only: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # LiveKit parses this as "key: secret" (space after the colon is
      # required). Without the space the process exits: "Could not parse keys".
      # Keys also live in the rendered yaml; env form is a second injection
      # path so operators can rotate without re-rendering if they prefer.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro

  coturn:
    image: coturn/coturn:4.6.3-alpine
    <<: [*restart, *log-cap]
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/tmp:mode=1777
      - /var/run:mode=0755
    volumes:
      - ./generated/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf", "--no-cli"]

  caddy:
    image: caddy:2.9.1-alpine
    <<: [*restart, *log-cap]
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
      # Loopback upstream for token-svc. The process itself is not in this
      # compose (TASK-040: no new services). Default matches token-svc Dockerfile.
      TOKEN_SVC_UPSTREAM: "${TOKEN_SVC_UPSTREAM}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
