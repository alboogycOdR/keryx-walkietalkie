# Redis is LiveKit room/routing state only. No persistence — TS §8.1 / §8.7:
# no server-side persistence of anything; no voice is ever recorded.

bind 127.0.0.1 -::1
protected-mode yes
port 6379
daemonize no
supervised no

# Refuse disk snapshots and AOF so a crash cannot leave join metadata behind.
save ""
appendonly no
dir /data

maxmemory 256mb
maxmemory-policy allkeys-lru

# Tighten the attack surface; LiveKit only needs GET/SET/PUBSUB.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

timeout 0
tcp-keepalive 300
